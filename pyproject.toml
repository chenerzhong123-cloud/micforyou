[project]
name = "micforyou"
version = "0.1.1"
description = "Local target-speaker audio preprocessor for Doubao IME"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
micforyou = "micforyou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micforyou"]

[tool.pytest.ini_options]
testpaths = ["tests"]

