[project]
name = "micforyou"
version = "0.2.1"
description = "Local target-speaker audio preprocessor for Doubao IME"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
model = ["torch==2.7.1", "torchaudio==2.7.1"]

[project.scripts]
micforyou = "micforyou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micforyou"]

[tool.pytest.ini_options]
testpaths = ["tests"]

